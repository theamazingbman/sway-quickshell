# === LAUNCH ===

# App launcher
bindsym $mod+space exec ~/.local/share/sway-min03/scripts/bar ipc call launcher toggle

# Terminal
bindsym $mod+Return exec $term

# Browser (Brave-Origin)
bindsym $mod+b exec brave-origin

# Browser (Brave-Origin private)
bindsym $mod+Shift+b exec brave-origin --incognito

# Show keybindings help
bindsym $mod+slash exec ~/.local/share/sway-min03/scripts/bar ipc call settings toggle

# Quickshell settings panel (layout tab)
bindsym $mod+Shift+t exec ~/.local/share/sway-min03/scripts/bar ipc call layouts toggle

# File manager (Thunar)
bindsym $mod+f exec thunar

# Text editor (change 'zed' to your preferred editor)
bindsym $mod+e exec flatpak run dev.zed.Zed

# Geany
bindsym $mod+g exec geany

# Discord
#bindsym $mod+d exec Discord

# OBS
#bindsym $mod+o exec obs

# === WINDOW STATE ===

# Toggle floating
bindsym $mod+Shift+space floating toggle

# Toggle fullscreen
bindsym $mod+Shift+f fullscreen

# Cycle layout (split → tabbed → stacking)
bindsym $mod+t layout toggle split tabbed stacking

# Tabbed layout
bindsym $mod+w layout tabbed

# Cycle through tabs / siblings in current container
bindsym Mod1+Tab focus next sibling
bindsym Mod1+Shift+Tab focus prev sibling

floating_modifier $mod normal

# === WM CONTROL ===

# Reload sway
bindsym $mod+Shift+r reload

# Exit sway
bindsym $mod+Shift+q exit

# Close window
bindsym $mod+q kill

# Power menu (screen off / logout / shutdown / reboot)
bindsym $mod+x exec ~/.local/share/sway-min03/scripts/power

# Screen off (any key or mouse move wakes it)
bindsym $mod+Shift+x exec ~/.local/share/sway-min03/scripts/screen-off

# Toggle notification center (swaync)
bindsym $mod+Shift+n exec ~/.local/share/sway-min03/scripts/network

# === WINDOW NAVIGATION ===

bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

bindsym $mod+$left focus left
bindsym $mod+$down focus down
bindsym $mod+$up focus up
bindsym $mod+$right focus right

# Move focused window
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

bindsym $mod+Shift+$left move left
bindsym $mod+Shift+$down move down
bindsym $mod+Shift+$up move up
bindsym $mod+Shift+$right move right

# === WINDOW RESIZE ===

bindsym $mod+Ctrl+Left resize shrink width 10px
bindsym $mod+Ctrl+Right resize grow width 10px
bindsym $mod+Ctrl+Up resize shrink height 10px
bindsym $mod+Ctrl+Down resize grow height 10px

bindsym $mod+Ctrl+$left resize shrink width 10px
bindsym $mod+Ctrl+$right resize grow width 10px
bindsym $mod+Ctrl+$up resize shrink height 10px
bindsym $mod+Ctrl+$down resize grow height 10px

# Balance windows
bindsym $mod+Ctrl+equal balance

# === MEDIA & BRIGHTNESS ===

bindsym XF86AudioRaiseVolume exec $config_dir/scripts/changevolume up
bindsym XF86AudioLowerVolume exec $config_dir/scripts/changevolume down
bindsym XF86AudioMute exec $config_dir/scripts/changevolume mute

# Volume control (custom bindings)
bindsym $mod+F9 exec $config_dir/scripts/changevolume up
bindsym $mod+F8 exec $config_dir/scripts/changevolume down
bindsym $mod+F7 exec $config_dir/scripts/changevolume mute

bindsym XF86MonBrightnessUp exec brightnessctl set +5%
bindsym XF86MonBrightnessDown exec brightnessctl set 5%-

# === SCREENSHOTS ===

# Fullscreen screenshot
bindsym $mod+s exec $config_dir/scripts/screenshot full

# Region screenshot
bindsym $mod+Shift+s exec $config_dir/scripts/screenshot region

# Quickshell controls
bindsym $mod+v exec ~/.local/share/sway-min03/scripts/clipboard
bindsym $mod+Shift+p exec ~/.local/share/sway-min03/scripts/bar ipc call wallpapers toggle
bindsym $mod+Shift+m exec ~/.local/share/sway-min03/scripts/bar ipc call commands toggle
bindsym $mod+Ctrl+b exec ~/.local/share/sway-min03/scripts/bar ipc call bar toggle
bindsym $mod+Escape exec ~/.local/share/sway-min03/scripts/lock
